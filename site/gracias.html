<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Solicitud recibida — Lumen Labs</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0C0C0E; --surface:#161619; --accent:#E8FF5A; --text:#F0EFEB; --text-muted:#8A8A8E; --text-dark:#0C0C0E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:32px; line-height:1.6;
  }
  .box { max-width:520px; }
  h1 { font-family:'Instrument Serif',serif; font-size:clamp(2rem,5vw,2.8rem); font-weight:400; line-height:1.15; margin:24px 0 16px; }
  h1 em { font-style:italic; color:var(--accent); }
  p { color:var(--text-muted); margin-bottom:32px; }
  a.btn { background:var(--accent); color:var(--text-dark); padding:14px 32px; border-radius:100px; text-decoration:none; font-weight:700; display:inline-block; }
  footer { margin-top:40px; font-size:.78rem; color:var(--text-muted); }
</style>
</head>
<body>
<div class="box">
  <svg width="56" height="62" viewBox="0 0 40 44" fill="none">
    <path d="M24 4L12 22h12L16 40" stroke="#E8FF5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="8" y1="17" x2="32" y2="17" stroke="#E8FF5A" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
    <line x1="8" y1="27" x2="32" y2="27" stroke="#E8FF5A" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  </svg>
  <h1>Recibimos tu solicitud de <em>diagnóstico</em></h1>
  <p>Te escribimos dentro de las próximas 24 horas hábiles para coordinar la videollamada de 15 minutos.</p>
  <a href="/" class="btn">Volver al inicio</a>
  <footer>© 2026 LumenHash SpA · Antonio Bellet 193, of. 1210, Providencia, Santiago</footer>
</div>
</body>
</html>
